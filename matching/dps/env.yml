# conda-forge environment for the Brazil matching container (matching/dps/Containerfile).
# conda-forge R, like Veronika's own runs (GEDI-change/gedi_change_env.yml), and its own OpenSSL:
# the Ubuntu-based rocker image failed on DPS creating an SSL context (likely Ubuntu's
# OpenSSL switching to FIPS mode on the DPS hosts).
name: base
channels:
  - conda-forge
dependencies:
  - python=3.12
  - boto3
  - r-base=4.4
  - r-terra
  - r-sf
  - r-dplyr
  - r-tidyr
  - r-stringr
  - r-purrr
  - r-data.table
  - r-foreach
  - r-doparallel
  - r-optmatch
