name: match-brazil
on:
  push:
    branches:
      - main
    paths:
      - 'matching/dps/**'
      - 'matching/r/brazil_v3/**'
      - '.github/workflows/match-brazil.yml'

concurrency:
  group: ogc-app-pack-deploy
  cancel-in-progress: false

jobs:
  generate_app_pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v6

      # Builds the container image (pushed to this repo's GHCR), generates the CWL and commits
      # it to matching/dps/cwl_workflows/. Registration with MAAP is done from the Hub, as for
      # extract_tile, so no MAAP token is stored in GitHub.
      - name: Use OGC App Pack Generator Action
        uses: MAAP-Project/ogc-app-pack-generator@1.1.0
        with:
          algorithm-configuration-path: matching/dps/algorithm_config.yml
          dockerfile-path: matching/dps/Containerfile
          deploy-app-pack: false
          cwl-workflow-dir: matching/dps/cwl_workflows
